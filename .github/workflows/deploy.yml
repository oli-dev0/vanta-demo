name: Test and deploy Vanta demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vanta_demo_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vanta_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Check production runtime
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-production-check-only-0123456789abcdef0123456789abcdef
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vanta_demo_ci
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          SECURE_HSTS_SECONDS: "31536000"
          VANTA_DEMO_SKIP_RUNTIME_CHECKS: "True"
        run: uv run python manage.py check --deploy
      - name: Check and test demo runtime
        env:
          DJANGO_SETTINGS_MODULE: config.settings.demo
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: demo-ci-only
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vanta_demo_ci
          VANTA_DEMO_HASH_SECRET: demo-ci-only
          VANTA_DEMO_WORKSPACE_ROOT: /tmp/vanta-demo-ci-workspaces
          VANTA_DEMO_SEED_PATH: /tmp/vanta-demo-ci-seed.sqlite3
          VANTA_DEMO_SKIP_RUNTIME_CHECKS: "True"
        run: |
          mkdir -p /tmp/vanta-demo-ci-workspaces
          uv run python manage.py migrate --noinput
          DJANGO_SETTINGS_MODULE=config.settings.demo_seed VANTA_DEMO_SEED_PATH=/tmp/vanta-demo-ci-seed.sqlite3 uv run python manage.py build_vanta_demo_seed --force
          uv run python manage.py test tests

  deploy:
    name: Deploy through Tailscale
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --output /dev/null \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_URL"
