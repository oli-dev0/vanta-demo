[project]
name = "vanta-demo"
version = "0.1.0"
description = "Standalone interactive Vanta Admin demo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1,<6.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.4",
    "vanta-admin==0.22.2",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "django-stubs>=6.0.5",
    "ruff>=0.15.18",
]
